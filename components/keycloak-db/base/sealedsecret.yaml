# Scellé pour le cluster partagé : déchiffrable uniquement par son contrôleur (ADR-0009).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-db
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak-db
    app.kubernetes.io/part-of: kube-identity
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: keycloak-db
      namespace: identity
      labels:
        app.kubernetes.io/name: keycloak-db
        app.kubernetes.io/part-of: kube-identity
