# Scellé pour le cluster partagé : déchiffrable uniquement par son contrôleur (ADR-0009).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak
  namespace: identity
  labels: &id001
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: kube-identity
spec:
  encryptedData:
    DEMO_ADMIN_PASSWORD: 
    DEMO_VIEWER_PASSWORD: 
    DEX_CLIENT_SECRET: 
    KC_BOOTSTRAP_ADMIN_PASSWORD: 
    KC_BOOTSTRAP_ADMIN_USERNAME: 
  template:
    metadata:
      name: keycloak
      namespace: identity
      labels: *id001
