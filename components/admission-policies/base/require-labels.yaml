apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-labels
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  # Fail : une erreur de CEL doit bloquer la requête en mode Deny (ADR-0016).
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  # Évite les doublons : un objet créé par un contrôleur est contrôlé à travers son parent.
  matchConditions:
    - name: not-controller-owned
      expression: "!has(object.metadata.ownerReferences)"
  variables:
    - name: podLabels
      expression: >-
        request.kind.kind == 'Pod' ? dyn(object).metadata.?labels.orValue({}) :
        request.kind.kind == 'CronJob' ? dyn(object).spec.jobTemplate.spec.template.?metadata.?labels.orValue({}) :
        dyn(object).spec.template.?metadata.?labels.orValue({})
  validations:
    - expression: >-
        ['app.kubernetes.io/name', 'app.kubernetes.io/part-of'].all(l,
        l in dyn(object).metadata.?labels.orValue({}) && l in variables.podLabels)
      message: Labels app.kubernetes.io/name et app.kubernetes.io/part-of requis sur le workload et son template
---
# Deny sur les namespaces enforced — opt-in par label uniquement (ADR-0016).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-labels-enforced
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  policyName: require-labels
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        policy.kube/enforced: "true"
---
# Warn sur les namespaces en essai — rollback : retirer le label du namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-labels-audit
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  policyName: require-labels
  validationActions: [Warn]
  matchResources:
    namespaceSelector:
      matchLabels:
        policy.kube/audit: "true"
