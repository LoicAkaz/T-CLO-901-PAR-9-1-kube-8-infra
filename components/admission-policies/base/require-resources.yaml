apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-resources
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  # Fail : une erreur de CEL doit bloquer la requête en mode Deny (ADR-0016).
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  # Évite les doublons : un objet créé par un contrôleur est contrôlé à travers son parent.
  matchConditions:
    - name: not-controller-owned
      expression: "!has(object.metadata.ownerReferences)"
  variables:
    - name: podSpec
      expression: >-
        request.kind.kind == 'Pod' ? dyn(object).spec :
        request.kind.kind == 'CronJob' ? dyn(object).spec.jobTemplate.spec.template.spec :
        dyn(object).spec.template.spec
    - name: containers
      expression: variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
        c.?resources.?requests.?cpu.hasValue() && c.?resources.?requests.?memory.hasValue() &&
        c.?resources.?limits.?cpu.hasValue() && c.?resources.?limits.?memory.hasValue())
      message: Chaque conteneur doit définir requests et limits cpu et memory
---
# Deny sur les namespaces enforced — opt-in par label uniquement (ADR-0016).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-resources-enforced
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  policyName: require-resources
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        policy.kube/enforced: "true"
---
# Warn sur les namespaces en essai — rollback : retirer le label du namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-resources-audit
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  policyName: require-resources
  validationActions: [Warn]
  matchResources:
    namespaceSelector:
      matchLabels:
        policy.kube/audit: "true"
