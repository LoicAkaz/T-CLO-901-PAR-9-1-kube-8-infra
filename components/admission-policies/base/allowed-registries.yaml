# Reste en Warn jusqu'à M5 : l'owner GHCR et le registry de la BDD restent à trancher (#43 du dépôt principal).
# Warning attendu sur whoami : traefik/whoami vient de docker.io (application de test, M3).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: allowed-registries
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  # Ignore : reste en Warn, pas en Deny — une erreur ne doit pas bloquer.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  # Évite les doublons : un objet créé par un contrôleur est contrôlé à travers son parent.
  matchConditions:
    - name: not-controller-owned
      expression: "!has(object.metadata.ownerReferences)"
  variables:
    - name: podSpec
      expression: >-
        request.kind.kind == 'Pod' ? dyn(object).spec :
        request.kind.kind == 'CronJob' ? dyn(object).spec.jobTemplate.spec.template.spec :
        dyn(object).spec.template.spec
    - name: containers
      expression: variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, ['ghcr.io/'].exists(p, c.image.startsWith(p)))
      message: Image hors des registries autorisés
---
# Warn sur les namespaces enforced — restera en Warn jusqu'à M5 (Q4).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: allowed-registries-enforced
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  policyName: allowed-registries
  validationActions: [Warn, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        policy.kube/enforced: "true"
---
# Warn sur les namespaces en essai.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: allowed-registries-audit
  labels:
    app.kubernetes.io/name: admission-policies
    app.kubernetes.io/part-of: kube-platform
spec:
  policyName: allowed-registries
  validationActions: [Warn]
  matchResources:
    namespaceSelector:
      matchLabels:
        policy.kube/audit: "true"
