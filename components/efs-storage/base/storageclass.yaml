# PV statiques (ADR-0014) : le rôle IAM des nœuds n'a pas les droits sur les access points (#49).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-static
  labels:
    app.kubernetes.io/name: efs-storage
    app.kubernetes.io/part-of: kube-platform
provisioner: efs.csi.aws.com
# Aucune suppression de données EFS sans confirmation explicite.
reclaimPolicy: Retain
