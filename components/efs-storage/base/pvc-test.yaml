# Essai du provisioning dynamique (#49) : Bound = StorageClass conservée ; Pending = PV statique (ADR-0014).
# À retirer une fois le mode tranché. L'access point créé reste à supprimer par un humain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-ap-test
  namespace: default
  labels:
    app.kubernetes.io/name: efs-storage
    app.kubernetes.io/part-of: kube-platform
spec:
  accessModes: [ReadWriteMany]
  storageClassName: efs-ap
  resources:
    requests:
      storage: 1Gi
