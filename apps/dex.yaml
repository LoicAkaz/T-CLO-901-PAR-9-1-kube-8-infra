# Dépend de keycloak (wave 2) : Keycloak doit être prêt avant que dex tente le connecteur OIDC.
# DEX_CONNECTOR_SECRET doit correspondre au DEX_CLIENT_SECRET scellé dans le composant keycloak.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: kube-identity
spec:
  project: default
  source:
    repoURL: https://charts.dexidp.io
    chart: dex
    targetRevision: 0.26.0
    helm:
      valuesObject:
        envFrom:
          - secretRef:
              name: dex-clients
        config:
          issuer: https://dex.56.228.56.225.sslip.io
          storage:
            type: kubernetes
          connectors:
            - type: oidc
              id: keycloak
              name: Keycloak
              config:
                issuer: https://keycloak.56.228.56.225.sslip.io/realms/kube
                clientID: dex
                clientSecret: $DEX_CONNECTOR_SECRET
                scopes: [openid, profile, email, groups]
                insecureEnableGroups: true
                getUserInfo: true
          staticClients:
            - id: argocd
              name: ArgoCD
              secret: $ARGOCD_CLIENT_SECRET
              redirectURIs:
                - https://argocd.56.228.56.225.sslip.io/auth/callback
            - id: grafana
              name: Grafana
              secret: $GRAFANA_CLIENT_SECRET
              redirectURIs:
                - https://grafana.56.228.56.225.sslip.io/login/generic_oauth
            - id: headlamp
              name: Headlamp
              secret: $HEADLAMP_CLIENT_SECRET
              redirectURIs:
                - https://headlamp.56.228.56.225.sslip.io/oidc-callback
            - id: kubernetes
              name: Kubernetes CLI
              public: true
              trustedPeers: [headlamp]
              redirectURIs:
                - http://localhost:8000
        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: dex.56.228.56.225.sslip.io
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: dex-tls
              hosts:
                - dex.56.228.56.225.sslip.io
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        # composants de la plateforme sur le master : seul nœud à 8 Gio (ADR-0012)
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        extraObjects:
          # Scellé pour le cluster partagé : déchiffrable uniquement par son contrôleur (ADR-0009).
          # DEX_CONNECTOR_SECRET doit correspondre à DEX_CLIENT_SECRET dans le composant keycloak.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: dex-clients
              namespace: identity
            spec:
              encryptedData:
                ARGOCD_CLIENT_SECRET: 
                DEX_CONNECTOR_SECRET: 
                GRAFANA_CLIENT_SECRET: 
                HEADLAMP_CLIENT_SECRET: 
              template:
                metadata:
                  name: dex-clients
                  namespace: identity
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
