# Dashboard (ADR-0011). Dépend de dex (wave 3) et des flags OIDC de l'API server (Ansible, rôle k3s_server).
# Le ServiceAccount du chart n'a aucun droit : chaque action utilise le jeton de l'utilisateur.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: kube-platform
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.46.0
    helm:
      valuesObject:
        # le chart lie cluster-admin au ServiceAccount par défaut
        clusterRoleBinding:
          create: false
        config:
          oidc:
            secret:
              create: false
            externalSecret:
              enabled: true
              name: headlamp-oidc
              hasScopes: true
            callbackURL: https://headlamp.56.228.56.225.sslip.io/oidc-callback
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-staging
          hosts:
            - host: headlamp.56.228.56.225.sslip.io
              paths:
                - path: /
                  type: Prefix
          tls:
            - secretName: headlamp-tls
              hosts:
                - headlamp.56.228.56.225.sslip.io
        podLabels:
          app.kubernetes.io/part-of: kube-platform
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # sur un worker : le disque du master est proche du seuil de 70 % (ADR-0025)
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        extraManifests:
          # Scellé pour ce cluster (ADR-0009). OIDC_CLIENT_SECRET = HEADLAMP_CLIENT_SECRET de dex-clients.
          # L'audience « kubernetes » (trustedPeers dans dex) fait accepter le jeton par l'API server.
          - |
            apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: headlamp-oidc
              namespace: headlamp
            spec:
              encryptedData:
                OIDC_CLIENT_SECRET: 
              template:
                metadata:
                  name: headlamp-oidc
                  namespace: headlamp
                data:
                  OIDC_CLIENT_ID: headlamp
                  OIDC_ISSUER_URL: https://dex.56.228.56.225.sslip.io
                  OIDC_SCOPES: profile,email,groups,audience:server:client_id:kubernetes,audience:server:client_id:headlamp
                  OIDC_CALLBACK_URL: https://headlamp.56.228.56.225.sslip.io/oidc-callback
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/part-of: kube-platform
        # Warn seulement : le chart ne permet pas de poser les labels sur le Deployment
        policy.kube/audit: "true"
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
