apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efs-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: efs-storage
    app.kubernetes.io/part-of: kube-platform
spec:
  project: default
  source:
    repoURL: https://github.com/LoicAkaz/T-CLO-901-PAR-9-1-kube-8-infra.git
    targetRevision: main
    path: components/efs-storage/overlays/prod
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
