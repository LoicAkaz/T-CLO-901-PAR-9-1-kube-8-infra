# ArgoCD se gère depuis Git (ADR-0019). Version figée = argocd_chart_version dans Ansible.
# prune: false : ArgoCD ne supprime pas ses propres ressources de bootstrap.
# Dépend de dex (wave 3) : l'issuer OIDC doit être disponible avant la reconfiguration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: kube-platform
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.5
    helm:
      valuesObject:
        dex:
          enabled: false
        notifications:
          enabled: false
        configs:
          params:
            server.insecure: "true"
          cm:
            url: https://argocd.56.228.56.225.sslip.io
            oidc.config: |
              name: SSO
              issuer: https://dex.56.228.56.225.sslip.io
              clientID: argocd
              clientSecret: $argocd-oidc:clientSecret
              requestedScopes:
                - openid
                - profile
                - email
                - groups
          rbac:
            policy.default: "role:''"
            policy.csv: |
              g, k8s-admins, role:admin
              g, k8s-viewers, role:readonly
        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-staging
            hostname: argocd.56.228.56.225.sslip.io
            tls: true
            extraTls:
              - hosts:
                  - argocd.56.228.56.225.sslip.io
                secretName: argocd-tls
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          nodeSelector: &master
            node-role.kubernetes.io/control-plane: "true"
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          nodeSelector: *master
        repoServer:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          nodeSelector: *master
        applicationSet:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          nodeSelector: *master
        redis:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          nodeSelector: *master
        extraObjects:
          # Scellé pour ce cluster (ADR-0009). clientSecret doit correspondre à
          # ARGOCD_CLIENT_SECRET dans le SealedSecret dex-clients du namespace identity.
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              name: argocd-oidc
              namespace: argocd
              labels:
                app.kubernetes.io/part-of: argocd
            spec:
              encryptedData:
                clientSecret: 
              template:
                metadata:
                  name: argocd-oidc
                  namespace: argocd
                  labels:
                    app.kubernetes.io/part-of: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
